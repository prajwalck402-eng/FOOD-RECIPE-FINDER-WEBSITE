services:
  - type: web
    name: savory-recipe-finder
    env: node
    plan: free
    region: oregon
    buildCommand: npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: GROQ_MODEL
        value: qwen/qwen3.6-27b
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false
